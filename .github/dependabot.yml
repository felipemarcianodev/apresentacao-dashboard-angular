# Atualizações de dependência pelo Dependabot. Os PRs abrem contra a main e passam pelo mesmo
# fluxo de revisão; o deploy só acontece num branch release/*.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    # Versão maior do Angular (e o TypeScript que vem junto) se atualiza com ng update, que roda
    # as migrações; o Dependabot só traz versão menor e correção.
    ignore:
      - dependency-name: '@angular/*'
        update-types: ['version-update:semver-major']
      - dependency-name: '@angular-devkit/*'
        update-types: ['version-update:semver-major']
      - dependency-name: typescript
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
    groups:
      angular:
        patterns: ['@angular/*', '@angular-devkit/*', 'typescript']
      testes:
        patterns: ['@playwright/*', '@axe-core/*', 'vitest', '@vitest/*']
      tailwind:
        patterns: ['tailwindcss', '@tailwindcss/*', 'postcss']
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
      day: monday
      timezone: America/Sao_Paulo
    # Só digest novo da mesma linha. Troca de versão do nginx (ímpar é a mainline, não a estável)
    # e de versão maior do Node é decisão de manutenção, feita à mão.
    ignore:
      - dependency-name: nginx
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: node
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: nuget
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    groups:
      microsoft:
        patterns: ['Microsoft.*', 'Npgsql*']
      testes:
        patterns: ['xunit*', 'Testcontainers*']
    # Versão maior do .NET e do EF Core acompanha a troca do SDK, feita à mão.
    ignore:
      - dependency-name: 'Microsoft.*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'Npgsql*'
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: docker-compose
    directory: /docker
    schedule:
      interval: weekly
      day: monday
      timezone: America/Sao_Paulo
    # Postgres e Redis: só digest novo da mesma versão maior (troca de versão maior do Postgres
    # exige migrar o volume de dados).
    ignore:
      - dependency-name: postgres
        update-types: ['version-update:semver-major']
      - dependency-name: redis
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: build
      include: scope

  # Actions do workflow do PR, fixadas por SHA: o Dependabot propõe o SHA da versão nova.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: America/Sao_Paulo
    commit-message:
      prefix: ci
      include: scope
