# Atualizações de dependência pelo Dependabot. Os PRs abrem contra a main e passam pelo mesmo
# fluxo de revisão; o deploy só acontece num branch release/*.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    # Versão maior do Angular (e o TypeScript que vem junto) se atualiza com ng update, que roda
    # as migrações; o Dependabot só traz versão menor e correção.
    ignore:
      - dependency-name: '@angular/*'
        update-types: ['version-update:semver-major']
      - dependency-name: '@angular-devkit/*'
        update-types: ['version-update:semver-major']
      - dependency-name: typescript
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
    groups:
      angular:
        patterns: ['@angular/*', '@angular-devkit/*', 'typescript']
      testes:
        patterns: ['@playwright/*', '@axe-core/*', 'karma*', 'jasmine*', '@types/jasmine']
      tailwind:
        patterns: ['tailwindcss', '@tailwindcss/*', 'postcss']
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
      day: monday
      timezone: America/Sao_Paulo
    # Só digest novo da mesma linha. Troca de versão do nginx (ímpar é a mainline, não a estável)
    # e de versão maior do Node é decisão de manutenção, feita à mão.
    ignore:
      - dependency-name: nginx
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: node
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: build
      include: scope
