<p class="text-xs font-semibold tracking-wide text-muted uppercase">{{ rotulo() }}</p>

<div class="flex flex-wrap items-end justify-between gap-x-3 gap-y-2">
  <p class="text-2xl font-bold tracking-tight whitespace-nowrap tabular-nums">
    {{ valorFormatado() }}
    @if (unidade()) {
      <span class="text-sm font-medium text-muted">{{ unidade() }}</span>
    }
  </p>
  @if (serie().length > 1) {
    <mi-sparkline
      class="w-24 shrink-0"
      [class.text-up]="tendencia()?.avaliacao === 'boa'"
      [class.text-down]="tendencia()?.avaliacao === 'ruim'"
      [class.text-accent]="!tendencia() || tendencia()?.avaliacao === 'neutra'"
      [valores]="serie()"
      [altura]="32"
    />
  }
</div>

@if (tendencia(); as t) {
  <p class="flex flex-wrap items-center gap-x-1.5 text-xs">
    <span
      class="inline-flex items-center gap-1 font-semibold tabular-nums"
      [class.text-up]="t.avaliacao === 'boa'"
      [class.text-down]="t.avaliacao === 'ruim'"
      [class.text-muted]="t.avaliacao === 'neutra'"
    >
      <i class="fa-solid" [class]="t.icone" aria-hidden="true"></i>
      <span class="sr-only">{{ t.leitura }}</span>
      {{ t.texto }}
    </span>
    @if (rotuloVariacao()) {
      <span class="text-muted">{{ rotuloVariacao() }}</span>
    }
  </p>
}

@if (referencia()) {
  <p class="mt-auto text-xs text-muted">{{ referencia() }}</p>
}
