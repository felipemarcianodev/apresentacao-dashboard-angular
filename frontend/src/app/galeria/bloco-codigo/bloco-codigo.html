<div class="overflow-hidden rounded-lg border border-line bg-sunken">
  <div class="flex items-center justify-between border-b border-line px-3 py-1.5">
    <span class="font-mono text-xs text-muted">{{ linguagem() }}</span>
    <button
      type="button"
      class="inline-flex min-h-10 items-center gap-1.5 rounded-md px-2 text-xs font-medium text-muted hover:bg-surface hover:text-fg"
      (click)="copiar()"
    >
      <i class="fa-solid" [class.fa-copy]="!copiado()" [class.fa-check]="copiado()" aria-hidden="true"></i>
      <span aria-live="polite">{{ copiado() ? 'Copiado' : 'Copiar' }}</span>
    </button>
  </div>
  <pre tabindex="0" class="overflow-x-auto p-4 font-mono text-[0.8rem] leading-relaxed"><code>{{ codigo() }}</code></pre>
</div>
