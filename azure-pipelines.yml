# Pipeline do Mirante (site Angular e API .NET), no molde dos demais projetos do portfólio.
#
# Disparo: push em release/* (ou manual). O repositório é o do GitHub (público), ligado ao
# Azure DevOps por service connection do GitHub.
#
# Fluxo:
#   1. Portões no agente: npm audit (só produção), testes unitários, build de produção; build e
#      testes do backend (unidade e integração com Postgres e Redis reais, via Testcontainers).
#   2. Build das imagens no agente e E2E (Playwright) contra o container do site, com a CSP e os
#      headers do nginx de produção.
#   3. docker save | scp | docker load na VPS (compilar na VPS esgota a memória e derruba os
#      outros apps do servidor) e subida da stack (web, api, postgres e redis) esperando o health.
#
# Variable group "mirante-producao": SERVER_IP, SERVER_USER, SSH_PUBLICKEY,
# SSH_KNOWN_HOSTS (linha completa da host key da VPS, ex.: saída de ssh-keyscan -t ed25519 <ip>,
# conferida uma vez à mão), DEPLOY_PATH (/opt/mirante), BIND_ADDR_INTERNAL (127.0.0.1) e
# MIRANTE_DB_SENHA (secreta: senha do Postgres, sem aspas simples nem quebra de linha).
# Secure file: id_ed25519_kinghost (o mesmo dos outros projetos).
#
# O domínio chega ao container pelo nginx de borda (repositório planuz,
# docker/nginx/conf.d/site-mirante.conf), na rede docker externa "edge".

name: $(SourceBranchName)-$(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include:
      - release/*

pr: none

parameters:
  - name: rodarE2e
    displayName: "Rodar o E2E (Playwright) contra a imagem antes do deploy"
    type: boolean
    default: true
  - name: deploy
    displayName: "Deploy via SSH no servidor de produção"
    type: boolean
    default: true

pool:
  vmImage: ubuntu-latest

variables:
  - group: mirante-producao

steps:
  - task: UseNode@1
    displayName: "Instalar Node.js 22"
    inputs:
      version: 22.x

  - script: |
      set -e
      npm ci --ignore-scripts
      npm audit --omit=dev --audit-level=high
    displayName: "Dependências e npm audit (produção)"

  - script: |
      set -e
      npm run test:ci
      npm run build:deploy
    displayName: "Testes unitários e build de produção"

  - task: UseDotNet@2
    displayName: "Instalar .NET 10"
    inputs:
      packageType: sdk
      version: 10.0.x

  - script: |
      set -e
      cd backend
      dotnet build Mirante.slnx -c Release
      # De dentro de backend/: o global.json liga o Microsoft Testing Platform. A integração
      # usa o Docker do agente (Testcontainers).
      dotnet test --solution Mirante.slnx -c Release --no-build
    displayName: "Backend: build e testes (unidade e integração)"

  - script: |
      set -e
      docker build --progress=plain -f docker/Dockerfile.web -t mirante-web:latest .
      docker build --progress=plain -f docker/Dockerfile.api -t mirante-api:latest .
    displayName: "Build das imagens (web e api)"

  - script: |
      set -e
      # Só o site: o E2E responde o /api com as gravações (HAR), sem depender da API.
      docker run -d --name mirante-e2e -p 8092:80 mirante-web:latest
      npx playwright install --with-deps chromium
      for i in $(seq 1 20); do curl -fsS http://localhost:8092/health && break; sleep 1; done
      E2E_BASE_URL=http://localhost:8092 CI=1 npx playwright test
    displayName: "E2E contra o container (CSP e headers de produção)"
    condition: and(succeeded(), eq('${{ parameters.rodarE2e }}', 'true'))

  - task: InstallSSHKey@0
    displayName: "[Deploy] Instalar chave SSH"
    condition: and(succeeded(), eq('${{ parameters.deploy }}', 'true'))
    inputs:
      # Host key fixa do variable group: um ssh-keyscan em runtime aceitaria qualquer servidor.
      knownHostsEntry: $(SSH_KNOWN_HOSTS)
      sshPublicKey: $(SSH_PUBLICKEY)
      sshKeySecureFile: id_ed25519_kinghost

  - script: |
      set -e
      SSH_OPTS="-o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o TCPKeepAlive=yes -o ConnectTimeout=20"
      ssh $SSH_OPTS $(SERVER_USER)@$(SERVER_IP) "DEPLOY_PATH='$(DEPLOY_PATH)' bash -s" << 'REMOTE_EOF'
      set -e
      if [ ! -d "${DEPLOY_PATH}/.git" ]; then
        echo "=== Clone inicial em ${DEPLOY_PATH} ==="
        sudo mkdir -p "${DEPLOY_PATH}"
        sudo chown "$(whoami)":"$(whoami)" "${DEPLOY_PATH}"
        git clone https://github.com/felipemarcianodev/apresentacao-dashboard-angular.git "${DEPLOY_PATH}"
      fi
      docker network ls --format '{{.Name}}' | grep -q '^edge$' || docker network create edge
      REMOTE_EOF
      # A senha vem do variable group como segredo, mapeada em env (nunca aparece no log). Vai
      # entre aspas simples no .env do compose e dentro da cadeia de conexão do Npgsql: por
      # isso não pode ter aspas simples nem ponto e vírgula.
      if [ -z "$MIRANTE_DB_SENHA" ] || printf '%s' "$MIRANTE_DB_SENHA" | grep -q "[';]"; then
        echo "##[error] MIRANTE_DB_SENHA vazia ou com aspas simples ou ponto e vírgula."
        exit 1
      fi
      umask 077
      printf "BIND_ADDR_INTERNAL=%s\nMIRANTE_DB_SENHA='%s'\n" "$(BIND_ADDR_INTERNAL)" "$MIRANTE_DB_SENHA" > /tmp/mirante.env
      scp $SSH_OPTS /tmp/mirante.env $(SERVER_USER)@$(SERVER_IP):$(DEPLOY_PATH)/docker/.env
      rm -f /tmp/mirante.env
      ssh $SSH_OPTS $(SERVER_USER)@$(SERVER_IP) "chmod 600 '$(DEPLOY_PATH)/docker/.env'"
    displayName: "[Deploy] Bootstrap do servidor (clone, rede edge e .env)"
    condition: and(succeeded(), eq('${{ parameters.deploy }}', 'true'))
    env:
      MIRANTE_DB_SENHA: $(MIRANTE_DB_SENHA)

  - script: |
      set -e
      docker save mirante-web:latest mirante-api:latest | gzip -1 > /tmp/mirante-images.tar.gz
      ls -lh /tmp/mirante-images.tar.gz
      scp -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o TCPKeepAlive=yes -o ConnectTimeout=20 \
        /tmp/mirante-images.tar.gz $(SERVER_USER)@$(SERVER_IP):/tmp/mirante-images.tar.gz
      rm -f /tmp/mirante-images.tar.gz
    displayName: "[Deploy] Envio das imagens para a VPS"
    condition: and(succeeded(), eq('${{ parameters.deploy }}', 'true'))

  - script: |
      set -e
      # O SHA do commit construído (só hexadecimal) e não o nome do branch: nome de ref pode
      # conter aspas e ponto e vírgula e viraria comando na VPS. Também garante que o compose
      # da VPS é o do mesmo commit da imagem.
      SHA="$(Build.SourceVersion)"
      if ! echo "$SHA" | grep -Eq '^[0-9a-f]{40}$'; then
        echo "##[error] Build.SourceVersion inesperado."
        exit 1
      fi
      ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o TCPKeepAlive=yes -o ConnectTimeout=20 \
        $(SERVER_USER)@$(SERVER_IP) "DEPLOY_PATH='$(DEPLOY_PATH)' SHA='$SHA' bash -s" << 'REMOTE_EOF'
      set -e
      cd "${DEPLOY_PATH}"
      git fetch origin "${SHA}"
      git reset --hard "${SHA}"
      git log -1 --oneline
      cd docker
      COMPOSE="docker compose -f docker-compose.yml -f docker-compose.prod.yml"
      # A versão no ar vira :anterior. Rollback manual:
      #   docker tag mirante-web:anterior mirante-web:latest && docker tag mirante-api:anterior mirante-api:latest
      #   e $COMPOSE up -d --no-build
      for imagem in mirante-web mirante-api; do
        if docker image inspect "$imagem:latest" > /dev/null 2>&1; then
          docker tag "$imagem:latest" "$imagem:anterior"
        fi
      done
      nice -n 10 ionice -c3 sh -c 'gunzip -c /tmp/mirante-images.tar.gz | docker load'
      rm -f /tmp/mirante-images.tar.gz
      # Postgres e Redis vêm por digest fixo do Docker Hub; o --wait espera o health de todos
      # (a API aplica as migrations na subida e só fica saudável depois).
      if ! $COMPOSE up -d --no-build --wait --wait-timeout 240; then
        echo "##[error] A stack não ficou saudável."
        $COMPOSE ps
        docker logs --tail 80 mirante-api || true
        exit 1
      fi
      curl -fsS http://127.0.0.1:8092/health > /dev/null
      curl -fsS http://127.0.0.1:8093/health/ready
      echo
      # Só imagens do Mirante: a VPS é compartilhada com outros apps.
      docker image prune -f --filter "label=app=mirante" > /dev/null
      $COMPOSE ps
      REMOTE_EOF
    displayName: "[Deploy] Carregar as imagens e subir a stack"
    condition: and(succeeded(), eq('${{ parameters.deploy }}', 'true'))
