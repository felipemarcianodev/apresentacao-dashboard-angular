# Mirante: um único container (SPA estática). Em produção, somar docker-compose.prod.yml.
name: mirante

services:
  web:
    image: mirante-web:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    container_name: mirante-web
    ports:
      # Só localhost por padrão: sem a borda na frente, o site sairia sem TLS nem HSTS.
      - "${BIND_ADDR_INTERNAL:-127.0.0.1}:8092:80"
    restart: unless-stopped
    mem_limit: 64m
    cpus: 0.25
    # Endurecimento: sistema de arquivos só leitura e só as capacidades que o nginx usa.
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID, NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
