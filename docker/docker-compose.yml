# Mirante: site (web), API .NET (api), reserva (postgres) e cache (redis). Em produção, somar
# docker-compose.prod.yml. O deploy atual troca só o web; a API entra em produção numa fase própria.
name: mirante

# Log do Docker com teto: a VPS é compartilhada e o disco não pode encher de log.
x-log: &log
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Redes separadas: o web só alcança a API (rede site); Postgres e Redis ficam na rede interna,
# que só a API enxerga e que não sai para a internet.
networks:
  site:
  interna:
    internal: true

services:
  web:
    image: mirante-web:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    container_name: mirante-web
    networks: [site]
    logging: *log
    ports:
      # Só localhost por padrão: sem a borda na frente, o site sairia sem TLS nem HSTS.
      - "${BIND_ADDR_INTERNAL:-127.0.0.1}:8092:80"
    restart: unless-stopped
    mem_limit: 64m
    cpus: 0.25
    # Endurecimento: sistema de arquivos só leitura e só as capacidades que o nginx usa.
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID, NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true

  api:
    image: mirante-api:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: mirante-api
    # Na rede site (o web chega nela) e na interna (Postgres e Redis). A rede default dá a saída
    # para a internet que as fontes oficiais exigem.
    networks: [default, site, interna]
    logging: *log
    ports:
      # Só para desenvolvimento local; em produção o acesso é pela rede interna, via web.
      - "127.0.0.1:8093:8080"
    environment:
      ConnectionStrings__Postgres: "Host=postgres;Database=mirante;Username=mirante;Password=${MIRANTE_DB_SENHA:-mirante-local}"
      ConnectionStrings__Redis: "redis:6379"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.5
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  postgres:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    container_name: mirante-postgres
    networks: [interna]
    logging: *log
    environment:
      POSTGRES_DB: mirante
      POSTGRES_USER: mirante
      # Senha local de desenvolvimento; em produção vem do variable group (MIRANTE_DB_SENHA).
      POSTGRES_PASSWORD: "${MIRANTE_DB_SENHA:-mirante-local}"
    volumes:
      - postgres-dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mirante -d mirante"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    mem_limit: 192m
    cpus: 0.5
    # O entrypoint do Postgres troca o dono dos dados e desce para o usuário postgres: só isso.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:8-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    container_name: mirante-redis
    networks: [interna]
    logging: *log
    # É cache: sem persistência em disco e com teto de memória, descartando o menos usado.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "48mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    mem_limit: 64m
    cpus: 0.25
    read_only: true
    cap_drop: [ALL]
    cap_add: [SETGID, SETUID]
    security_opt:
      - no-new-privileges:true

volumes:
  postgres-dados:
