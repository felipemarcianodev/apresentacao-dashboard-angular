# Server blocks do dominio mirante.felipemarcianodev.com (Mirante, kit de dashboard em Angular
# com dados abertos do IBGE, Banco Central e Ipeadata).
#
# O Mirante roda neste mesmo servidor como compose separado (/opt/mirante, projeto 'mirante'),
# com a porta bindada em 127.0.0.1. Este nginx (unico dono das portas 80/443) roteia o dominio
# pro container mirante-web pela rede docker compartilhada 'edge'.
#
# Um proxy unico para o mirante-web, que serve o site e encaminha /api para a API do Mirante
# (.NET, mesma origem). O navegador so fala com a propria origem: connect-src 'self'. A CSP e os
# headers repetem os do container (repo apresentacao-dashboard-angular, docker/nginx/seguranca.conf,
# que guarda uma copia deste arquivo em docker/borda/); este nginx e a autoridade final para o
# browser.
#
# Cert: emitir com docker/setup-letsencrypt-mirante.sh do repo do Mirante (mesmos volumes do
# planuz-certbot, que renova a cada 12h). Sem o cert, o nginx -t falha: emitir ANTES de recriar
# este nginx com este arquivo.

server {
    listen 80;
    listen [::]:80;
    server_name mirante.felipemarcianodev.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    listen [::]:443 ssl;
    server_name mirante.felipemarcianodev.com;

    ssl_certificate     /etc/letsencrypt/live/mirante.felipemarcianodev.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mirante.felipemarcianodev.com/privkey.pem;

    # TLS hardening (mesmo perfil dos demais sites)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    proxy_hide_header X-Frame-Options;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header Cross-Origin-Opener-Policy;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; require-trusted-types-for 'script'; trusted-types angular angular#bundler; upgrade-insecure-requests" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # O Cache-Control vem do container (imutável para arquivos com hash, no-cache para o resto).
    location / {
        set $upstream_mirante http://mirante-web:80;
        proxy_pass $upstream_mirante;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A primeira consulta ao Ipeadata pela API pode levar dezenas de segundos (depois vem do cache).
        proxy_read_timeout 90s;
    }
}
