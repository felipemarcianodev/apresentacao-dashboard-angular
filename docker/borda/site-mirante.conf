# Server blocks do domínio mirante.felipemarcianodev.com (Mirante, kit de dashboard).
#
# Cópia de referência: o arquivo que vale fica no repositório do Planuz, em
# docker/nginx/conf.d/site-mirante.conf, porque o container planuz-nginx é o único dono das
# portas 80/443 da VPS. Ele encaminha o domínio para o container mirante-web pela rede docker
# externa 'edge'. Manter os dois iguais.
#
# Os headers abaixo repetem docker/nginx/seguranca.conf do Mirante; este nginx é a autoridade
# final para o navegador (esconde os do container e define os seus).
#
# Cert: emitido por docker/setup-letsencrypt-mirante.sh e renovado pelo planuz-certbot.

server {
    listen 80;
    listen [::]:80;
    server_name mirante.felipemarcianodev.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    listen [::]:443 ssl;
    server_name mirante.felipemarcianodev.com;

    ssl_certificate     /etc/letsencrypt/live/mirante.felipemarcianodev.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mirante.felipemarcianodev.com/privkey.pem;

    # TLS hardening (mesmo perfil dos demais sites)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    proxy_hide_header X-Frame-Options;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header Cross-Origin-Opener-Policy;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; require-trusted-types-for 'script'; trusted-types angular angular#bundler; upgrade-insecure-requests" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # O Cache-Control vem do container (imutável para arquivos com hash, no-cache para o resto).
    location / {
        set $upstream_mirante http://mirante-web:80;
        proxy_pass $upstream_mirante;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
