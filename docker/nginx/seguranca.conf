# Headers de segurança do Mirante. Incluído em cada location que define add_header, porque o
# nginx não herda add_header do bloco pai quando o filho define o seu.
# O nginx de borda da VPS repete estes valores (ele é a autoridade final para o navegador).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self' https://servicodados.ibge.gov.br https://api.bcb.gov.br https://www.ipeadata.gov.br; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; require-trusted-types-for 'script'; trusted-types angular angular#bundler" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
