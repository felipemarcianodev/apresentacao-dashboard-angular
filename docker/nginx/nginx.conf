# nginx interno do container mirante-web. TLS e HSTS ficam no nginx de borda da VPS.

# Cache imutável só para resposta 200: um 404 de arquivo com hash não pode ficar guardado.
map $status $cache_com_hash {
    200     "public, max-age=31536000, immutable";
    default "no-store";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    autoindex off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    # O nginx de borda da VPS fala HTTP/1.0 com o container; sem isto, nada sai comprimido.
    gzip_http_version 1.0;
    gzip_proxied any;
    gzip_vary on;

    # Arquivos com hash no nome (gerados pelo build): cache longo e imutável.
    location ~* "-[A-Z0-9]{8}\.(js|css|woff2?)$" {
        include /etc/nginx/snippets/seguranca.conf;
        add_header Cache-Control $cache_com_hash always;
        try_files $uri =404;
    }

    # Malha das UFs: muda raramente, mas não tem hash no nome.
    location /geo/ {
        include /etc/nginx/snippets/seguranca.conf;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # API do Mirante (container mirante-api, na rede site). O nome é resolvido a cada requisição
    # pelo DNS do Docker: sem a API de pé, o site continua no ar e só o /api responde 502.
    # Só /api/: o /health/ready da API (que consulta Postgres e Redis) não sai daqui.
    location /api/ {
        include /etc/nginx/snippets/seguranca.conf;
        # A API manda os próprios nosniff e Referrer-Policy; sem isto, sairiam em dobro.
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        # A API só tem GET: nada de outro método nem corpo de requisição chega a ela.
        limit_except GET HEAD { deny all; }
        client_max_body_size 1k;
        # Caminho com ponto ou barra codificados não é consulta legítima de painel.
        if ($request_uri ~* "(%2e|%2f|%5c|\.\.)") { return 400; }
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $api http://mirante-api:8080;
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Encadeia o IP do visitante que a borda informou; a API só confia nele vindo da rede interna.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # O Ipeadata pode levar dezenas de segundos na primeira consulta (depois vem do cache).
        proxy_read_timeout 90s;
        proxy_connect_timeout 5s;
    }

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # index.html, theme-init.js, favicon e rotas da SPA: sempre revalidar.
    location / {
        include /etc/nginx/snippets/seguranca.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
